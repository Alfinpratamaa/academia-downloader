<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>academia-dl</title>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
<style>
body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
input { width: 100%; padding: .5rem; margin: .5rem 0; box-sizing: border-box; }
button { padding: .5rem 1rem; }
.bar { width: 100%; height: 1rem; background: #eee; border: 1px solid #ccc; }
.fill { height: 100%; background: #36c; }
.bar.indeterminate { background: repeating-linear-gradient(45deg, #eee, #eee 8px, #ddd 8px, #ddd 16px); }
.err { color: #b00; font-weight: bold; }
#result { margin-top: 1rem; }
</style>
</head>
<body>
<h1>academia-dl</h1>
<noscript><p>JS/htmx CDN is required for this UI.</p></noscript>
<form hx-post="/jobs" hx-target="#result" hx-swap="innerHTML">
<label for="url">academia.edu / scribd.com URL</label>
<input id="url" name="url" type="url" placeholder="https://www.academia.edu/…/Title or https://www.scribd.com/document/…/Title" required>
<button type="submit">Download</button>
</form>
<div id="result"></div>
</body>
</html>
