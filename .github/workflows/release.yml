name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04 → glibc 2.35: binary runs on 22.04/24.04, Debian 11/12.
    # (ubuntu-latest links glibc 2.38+, which older distros lack.)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (BoringSSL needs these)
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev pkg-config git

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: |
          tar -czf academia-dl-x86_64-unknown-linux-gnu.tar.gz -C target/release academia-dl
          tar -czf academia-web-x86_64-unknown-linux-gnu.tar.gz -C target/release academia-web

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            academia-dl-x86_64-unknown-linux-gnu.tar.gz
            academia-web-x86_64-unknown-linux-gnu.tar.gz
          generate_release_notes: true
