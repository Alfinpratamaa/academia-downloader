[package]
name = "academia-dl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "academia-dl"
path = "src/main.rs"

[[bin]]
name = "academia-web"
path = "src/bin/academia-web.rs"

[lib]
name = "academia_dl"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
wreq = { version = "6.0.0-rc.31", features = ["cookies", "stream"] }
wreq-util = { version = "3.0.0-rc.14" }
futures-util = "0.3"
scraper = "0.24"
regex = "1"
url = "2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
indicatif = "0.17"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
